version: 2
updates:
  - package-ecosystem: npm
    directory: /DJayTools-Free-QR-Generator-Source
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      safe-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
