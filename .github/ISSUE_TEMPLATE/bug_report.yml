name: Bug report
description: Report a reproducible problem in DJAI Browser Tools.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool area
      options:
        - QR Generator
        - Image Tools
        - PDF Tools
        - Document Tools
        - AI/Context Tools
        - Spreadsheet Tools
        - Build or documentation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Open...\n2. Select a synthetic file...\n3. Click..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: "Chrome 140 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not attach confidential, personal, customer, or proprietary files.
          required: true
